name: Publish Binary Release
run-name: Publish binary release ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Vendor dependencies
    runs-on: ubuntu-latest
    container: ghcr.io/rust-cross/cargo-zigbuild:0.23.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Vendor crate sources
        run: |
          cargo vendor --locked --versioned-dirs vendor > vendor-config.toml
          tar -cf vendor.tar vendor vendor-config.toml

      - name: Upload vendored dependencies
        uses: actions/upload-artifact@v7
        with:
          name: cargo-vendor
          path: vendor.tar
          if-no-files-found: error
          retention-days: 1

  # Every build runs in a pinned prebuilt image that already holds Rust, the cross
  # toolchain and the target: nothing is apt-installed or compiled to make a build
  # possible, which is what used to dominate the run.
  build-binaries:
    name: Build ${{ matrix.os_name }} ${{ matrix.arch }} binary
    runs-on: ubuntu-latest
    needs: prepare
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Zig links these and carries its own libc and macOS SDK, so no Apple host.
          - target: x86_64-unknown-linux-musl
            os_name: linux
            arch: amd64
            container: ghcr.io/rust-cross/cargo-zigbuild:0.23.0
            cargo_command: zigbuild
            suffix: ''
          - target: aarch64-unknown-linux-musl
            os_name: linux
            arch: arm64
            container: ghcr.io/rust-cross/cargo-zigbuild:0.23.0
            cargo_command: zigbuild
            suffix: ''
          - target: aarch64-apple-darwin
            os_name: darwin
            arch: arm64
            container: ghcr.io/rust-cross/cargo-zigbuild:0.23.0
            cargo_command: zigbuild
            suffix: ''
          - target: x86_64-apple-darwin
            os_name: darwin
            arch: amd64
            container: ghcr.io/rust-cross/cargo-zigbuild:0.23.0
            cargo_command: zigbuild
            suffix: ''
          # Both Windows arches go through the MSVC toolchain cargo-xwin assembles, the
          # one Rust ships its own installer as, so no mingw and no second dialect.
          - target: x86_64-pc-windows-msvc
            os_name: windows
            arch: amd64
            container: ghcr.io/rust-cross/cargo-xwin:0.23.0
            cargo_command: xwin build
            suffix: .exe
          - target: aarch64-pc-windows-msvc
            os_name: windows
            arch: arm64
            container: ghcr.io/rust-cross/cargo-xwin:0.23.0
            cargo_command: xwin build
            suffix: .exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # A no-op on an unchanged image, and the error the build would otherwise give if
      # one of them ever drops a target.
      - name: Confirm the target is installed
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "${TARGET}"

      - name: Download vendored dependencies
        uses: actions/download-artifact@v8
        with:
          name: cargo-vendor

      - name: Use vendored dependencies
        run: |
          tar -xf vendor.tar
          mkdir -p .cargo
          mv vendor-config.toml .cargo/config.toml

      - name: Build binary
        env:
          TARGET: ${{ matrix.target }}
          CARGO_COMMAND: ${{ matrix.cargo_command }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          # Accepts Microsoft's licence for the CRT and SDK headers cargo-xwin downloads.
          XWIN_ACCEPT_LICENSE: '1'
        run: |
          # The published tag is the only version this project has; a build from source
          # has no release behind it and reports "dev" instead.
          export CORBEL_VERSION="${TAG_NAME#v}"
          cargo ${CARGO_COMMAND} --release --locked --offline --target "${TARGET}"

      - name: Name release asset
        id: asset
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
          OS_NAME: ${{ matrix.os_name }}
          ARCH: ${{ matrix.arch }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          # Assets are shipped uncompressed so deploy.sh can curl one straight onto disk.
          asset_name="corbel_${TAG_NAME}_${OS_NAME}_${ARCH}${SUFFIX}"
          mkdir -p dist
          cp "target/${TARGET}/release/corbel${SUFFIX}" "dist/${asset_name}"
          chmod 755 "dist/${asset_name}"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binary-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/${{ steps.asset.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload release asset
        uses: actions/github-script@v9
        env:
          ASSET_NAME: ${{ steps.asset.outputs.asset_name }}
          ASSET_PATH: dist/${{ steps.asset.outputs.asset_name }}
          ASSET_CONTENT_TYPE: application/octet-stream
        with:
          retries: 3
          script: |
            const fs = require('fs')
            const assetName = process.env.ASSET_NAME
            const assetPath = process.env.ASSET_PATH
            const owner = context.repo.owner
            const repo = context.repo.repo
            const releaseId = context.payload.release.id

            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: releaseId,
              per_page: 100,
            })
            const existingAsset = existingAssets.find((asset) => asset.name === assetName)

            if (existingAsset) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: existingAsset.id,
              })
            }

            const data = fs.readFileSync(assetPath)

            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: releaseId,
              name: assetName,
              headers: {
                'content-type': process.env.ASSET_CONTENT_TYPE,
                'content-length': data.length,
              },
              data,
            })

  checksums:
    name: Publish checksums
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-binary-*
          merge-multiple: true

      - name: Generate checksums
        id: checksums
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          checksum_name="corbel_${TAG_NAME}_SHA256SUMS.txt"
          (
            cd dist
            sha256sum * > "${checksum_name}"
          )
          echo "checksum_name=${checksum_name}" >> "$GITHUB_OUTPUT"

      - name: Upload checksums to release
        uses: actions/github-script@v9
        env:
          ASSET_NAME: ${{ steps.checksums.outputs.checksum_name }}
          ASSET_PATH: dist/${{ steps.checksums.outputs.checksum_name }}
          ASSET_CONTENT_TYPE: text/plain
        with:
          retries: 3
          script: |
            const fs = require('fs')
            const assetName = process.env.ASSET_NAME
            const assetPath = process.env.ASSET_PATH
            const owner = context.repo.owner
            const repo = context.repo.repo
            const releaseId = context.payload.release.id

            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: releaseId,
              per_page: 100,
            })
            const existingAsset = existingAssets.find((asset) => asset.name === assetName)

            if (existingAsset) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: existingAsset.id,
              })
            }

            const data = fs.readFileSync(assetPath)

            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: releaseId,
              name: assetName,
              headers: {
                'content-type': process.env.ASSET_CONTENT_TYPE,
                'content-length': data.length,
              },
              data,
            })
