[package]
name = "corbel"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-or-later"
description = "G-code post-processor with two transforms: BrickLayers, which interlocks perimeters between layers, and Z anti-aliasing, which smooths the staircase off shallow surfaces"
repository = "https://github.com/erkexzcx/corbel"
readme = "README.md"
keywords = ["3d-printing", "gcode", "slicer", "post-processing", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
thiserror = "2"

[dev-dependencies]
crc32fast = "1"

[[bench]]
name = "throughput"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
